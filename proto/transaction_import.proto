syntax = "proto3";
package transactionimport;

option java_package = "pt.simaobaltazar.dividendtracker.grpc";
option java_multiple_files = true;

service TransactionImportService {
  rpc ImportTransactions (stream TransactionRecord) returns (ImportSummary);
}

message TransactionRecord {
  string type = 1;           
  string quantity = 2;
  string price = 3;
  string date = 4;           
  string asset_ticker = 5;
}

message ImportSummary {
  int32 imported = 1;
  int32 rejected = 2;
  repeated string errors = 3;
}